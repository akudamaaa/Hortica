{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101b27">
  <title>{% block title %}Яхта «Хортица»{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'pages/site.css' %}">
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <a class="brand" href="{% url 'home' %}" aria-label="Яхта Хортица — главная">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <span><strong>ХОРТИЦА</strong><small>яхта · Санкт-Петербург</small></span>
      </a>
      <nav class="main-nav" aria-label="Основная навигация">
        <a href="{% url 'home' %}">Старт</a>
        <a href="{% url 'history' %}">История</a>
        <a href="{% url 'crew' %}">Экипаж</a>
        <a href="{% url 'voyages' %}">Походы</a>
        <a class="nav-cta" href="{% url 'registration' %}">На борт ↗</a>
      </nav>
    </header>
    <main id="main-content">
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <span>ХОРТИЦА / ПАРУСНЫЙ АРХИВ</span>
      <span>Санкт-Петербург · проект некоммерческий</span>
      <a href="{% url 'registration' %}">Хочу узнать больше ↗</a>
    </footer>
  </div>
</body>
</html>
