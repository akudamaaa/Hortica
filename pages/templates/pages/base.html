{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102b3a">
  <title>{% block title %}Яхта «Хортица»{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'pages/site.css' %}">
  <script src="{% static 'pages/site.js' %}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">К содержанию</a>
  <div class="site-frame">
    <header class="site-header">
      <a class="brand" href="{% url 'home' %}" aria-label="Яхта Хортица — главная">
        <img class="brand-logo" src="{% static 'brand/Hortica_logo1.png' %}"
             data-logo-default="{% static 'brand/Hortica_logo1.png' %}"
             data-logo-hover="{% static 'brand/Hortica_logo.png' %}"
             alt="Логотип яхты «Хортица»" width="64" height="64">
        <span class="brand-copy"><strong>ХОРТИЦА</strong><small>ПАРУСНЫЙ ЭКИПАЖ</small></span>
      </a>
      <div class="header-actions">
        <a class="register-link" href="{% url 'registration' %}">Записаться на выход</a>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu">
          <span class="menu-icon" aria-hidden="true"><i></i><i></i><i></i></span>
          <span>МЕНЮ</span>
        </button>
        <nav class="menu-panel" id="site-menu" aria-label="Основная навигация" hidden>
          <a href="{% url 'project' %}"><span>01</span>О проекте</a>
          <a href="{% url 'history' %}"><span>02</span>История</a>
          <a href="{% url 'crew' %}"><span>03</span>Экипаж</a>
          <a href="{% url 'voyages' %}"><span>04</span>Походы и фотоархив</a>
          <a href="{% url 'coordinates' %}"><span>05</span>Координаты</a>
        </nav>
      </div>
    </header>
    <main id="main-content" tabindex="-1">
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <a class="footer-brand" href="{% url 'home' %}">ХОРТИЦА <span>·</span> ПАРУСНЫЙ АРХИВ</a>
      <nav aria-label="Навигация внизу страницы">
        <a href="{% url 'project' %}">Проект</a>
        <a href="{% url 'history' %}">История</a>
        <a href="{% url 'voyages' %}">Походы</a>
      </nav>
      <a class="footer-registration" href="{% url 'registration' %}">Записаться на выход ↗</a>
    </footer>
  </div>
  <dialog class="photo-dialog" aria-label="Просмотр фотографии">
    <button class="photo-close" type="button" aria-label="Закрыть фотографию">×</button>
    <button class="photo-step photo-previous" type="button" aria-label="Предыдущая фотография">←</button>
    <figure><img alt=""><figcaption></figcaption></figure>
    <button class="photo-step photo-next" type="button" aria-label="Следующая фотография">→</button>
    <output class="photo-counter" aria-live="polite"></output>
  </dialog>
</body>
</html>
